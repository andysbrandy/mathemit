name: Daily Feedback Analysis
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests tqdm
      - name: Run analysis
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/analyze_feedback.py
      - name: Commit & PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add feedback/*.md
            git commit -m "📝 Feedback-Analyse $(date +%F)"
            git push
            gh pr create --title "Feedback-Vorschläge $(date +%F)" --body "Automatisch generierte Verbesserungsvorschläge aus Feedback des Vortags." --base main --head feedback-analysis || true
          fi
