name: Weekly Feedback Summary
on:
  schedule:
    - cron: '0 11 * * 5'     # freitags 11:00 UTC = 12:00 CET (13:00 CEST im Sommer) - Wochen-Summary + Benachrichtigung
  workflow_dispatch:         # manueller Test

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run weekly summary (Entwicklungsprompt + Benachrichtigungs-Issue)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HF_API_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/weekly_summary.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add feedback/*.md
            git commit -m "📊 Wochen-Feedback-Bericht $(date +%F)"
            git push
          fi