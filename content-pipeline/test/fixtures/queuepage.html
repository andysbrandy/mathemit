<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="app-version" content="v999"><style>.offline-chip[hidden]{display:none}</style>
</head><body>
<div class="offline-chip" id="offlineChip" hidden><span id="offlineChipText"></span></div>
<script>
/*
 * Testgeruest fuer die Offline-Write-Queue.
 *
 * Laedt die ECHTE app-active.js aus dem Repo und stellt nur die
 * Umgebung bereit, die sie erwartet. Kein Nachbau: eine Kopie waere
 * genau die Stelle, an der sich Test und Produktion still unterscheiden
 * und der Test gruen bleibt, obwohl die App kaputt ist.
 */
window.__POSTS = [];
window.__MOCK = { status: 200, antworten: [] };

var state = { points: 0, streak: 0, bestStreak: 0, solved: 0, correct: 0,
  badges: [], mode: "alles", grade: "all", diff: 2, repeatQ: [], owls: [1],
  spaced: {}, weekly: {} };
var AUTH_BASE = "https://mapi.andybrandy.at";
var API = AUTH_BASE;
var MODES = [{ id: "alles" }];
var GRADES = [{ id: "all" }];

function sanitizeRepeatQ(x) { return x || []; }
function sanitizeOwls(x) { return x || [1]; }
function spacedSanitize(x) { return x || {}; }
function sanitizeWochen(x) { return x || {}; }
function ensureOwls() {}
function updateStatsUI() {}
function updateModeAmpel() {}
function showMsg() {}
function handleCheck() {}

function getToken() { return localStorage.getItem('mathemit_token'); }
function getUser() {
  var u = localStorage.getItem('mathemit_user');
  return u ? JSON.parse(u) : null;
}

/* Der Mock zaehlt jeden Aufruf und liefert den gesetzten Status.
 *
 * Zwei Stolperfallen hier, beide real erlebt:
 *
 * 1) app-active.js deklariert SELBST ein globales "apiFetch". Ein Mock
 *    mit gleichem Namen wird davon ueberschrieben — die Tests laufen
 *    dann gegen echte Netzaufrufe (sichtbar als CORS-Fehler auf
 *    mapi.andybrandy.at) und schlagen aus dem falschen Grund fehl.
 *    Darum heisst der Mock hier "mockApiFetch" und wird NACHHER
 *    ueber window.apiFetch gesetzt.
 *
 * 2) app-base.js wird nicht geladen; ohne "MB" bricht die App sofort mit
 *    "MB is not defined" ab und die Queue existiert gar nicht.
 */
function mockApiFetch(endpoint, options) {
  return new Promise(function (resolve) {
    var koerper = options && options.body ? JSON.parse(JSON.stringify(options.body)) : null;
    window.__POSTS.push({ endpoint: endpoint, koerper: koerper });
    var status = window.__MOCK.status || 200;
    ECHT(function () {
      resolve({ status: status === 200 ? 'ok' : 'error', _httpStatus: status });
    }, 5);
  });
}

/*
 * Timer-Behandlung fuer den Test:
 *   - kurze Delays (< 1s) laufen WIRKLICH. Dazu gehoert das 5-ms-Resolve
 *     des apiFetch-Mocks; kaeme es nie zum Lauf, haengt der Test.
 *   - lange Delays (>= 1s) werden nur gemerkt und nie ausgefuehrt. Das
 *     sind die Backoff-Versuche der Warteschlange (5s, 20s, 60s, 5min).
 *     Ohne das wuerde der Test am Ende minuetelang warten, obwohl der
 *     Sendeerfolg schon geprueft ist.
 */
var ECHT = window.setTimeout.bind(window);
var TIMER = [];
window.__TIMER = TIMER;
window.setTimeout = function (fn, ms) {
  if (ms >= 1000) { TIMER.push({ fn: fn, ms: ms }); return TIMER.length; }
  return ECHT(fn, ms);
};
window.clearTimeout = function (id) { if (TIMER[id - 1]) TIMER[id - 1].weg = true; };
window.setInterval = function () { return 0; };
</script>
<script>
/* MB-Stub: app-base.js wird nicht geladen, die App braucht es aber
 * sofort beim Start. Ohne das bricht der Code mit "MB is not defined"
 * ab und es gibt nichts zu pruefen. Muss VOR dem App-Skript stehen. */
window.MB = {
  GEN: {}, choice: function () {}, fmtAT: function (x) { return x; },
  fmtEUR: function (x) { return x; }, renderFigure: function () {},
  CURRICULUM_MAP: {}, badgeOf: function () { return "Aufgabe"; }
};
</script>
<script src="/app-active.js"></script>
<script>
/* Und JETZT erst den Mock einsetzen — vorher verdeckt die App ihn. */
window.apiFetch = mockApiFetch;
</script>
</body></html>
