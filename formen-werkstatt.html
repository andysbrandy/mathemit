<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die Formen-Werkstatt – Dreiecke & Vierecke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2E45;
    --paper:#F3F7FB;
    --grid:#DCE7F1;
    --panel:#FFFFFF;
    --triangle:#FF6B4A;
    --triangle-soft:#FFE3DA;
    --viereck:#1FA294;
    --viereck-soft:#D8F1EE;
    --gold:#F2A93B;
    --gold-soft:#FCEACB;
    --violet:#7C6FE0;
    --violet-soft:#E7E3FB;
    --success:#209A64;
    --success-soft:#DCF2E7;
    --error:#D8495A;
    --error-soft:#FBE1E3;
    --muted:#5B6E85;
    --line:#C9D8E5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--paper);
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* ---------- Header ---------- */
  .app-header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    margin-bottom:16px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:46px;height:46px; flex-shrink:0;}
  .brand h1{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.5rem; margin:0; line-height:1.1;
    letter-spacing:.2px;
  }
  .brand p{margin:2px 0 0; font-size:.8rem; color:var(--muted); font-weight:500;}

  .stats{display:flex; gap:8px; flex-wrap:wrap;}
  .stat-pill{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:7px 12px; display:flex; align-items:center; gap:7px;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:.85rem;
    box-shadow:0 2px 0 var(--line);
  }
  .stat-pill .lbl{font-family:'Inter',sans-serif; font-weight:600; color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.4px;}
  .stat-pill.streak{color:var(--gold);}
  .stat-pill.points{color:var(--violet);}
  .stat-pill.level{color:var(--viereck);}

  /* ---------- Level progress ---------- */
  .level-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .level-name{font-family:'Fredoka',sans-serif; font-weight:600; font-size:.95rem; white-space:nowrap;}
  .level-track{
    flex:1; height:10px; border-radius:6px; background:var(--line); overflow:hidden;
    border:1px solid var(--line);
  }
  .level-fill{
    height:100%; border-radius:6px;
    background:linear-gradient(90deg, var(--gold), var(--triangle));
    width:0%; transition:width .5s cubic-bezier(.4,1.4,.6,1);
  }
  .level-next{font-size:.72rem; color:var(--muted); white-space:nowrap; font-weight:600;}

  /* ---------- Chips ---------- */
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .chip{
    border:2px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:999px; padding:8px 15px; font-family:'Fredoka',sans-serif; font-weight:600;
    font-size:.85rem; cursor:pointer; transition:all .15s ease; user-select:none;
  }
  .chip:hover{border-color:var(--violet); transform:translateY(-1px);}
  .chip.active{background:var(--ink); border-color:var(--ink); color:#fff;}

  /* ---------- Main card ---------- */
  .board{
    background:var(--panel); border:1px solid var(--line); border-radius:22px;
    padding:22px; box-shadow:0 10px 0 var(--line), 0 12px 24px rgba(31,46,69,.08);
    display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start;
  }
  @media (max-width:680px){ .board{grid-template-columns:1fr; padding:16px;} }

  .figure-panel{
    background:var(--paper); border:1px dashed var(--line); border-radius:16px;
    padding:10px; display:flex; align-items:center; justify-content:center; min-height:220px;
    position:relative;
  }
  .figure-panel svg{width:100%; height:auto; max-height:260px; display:block;}
  .topic-badge{
    position:absolute; top:10px; left:10px; font-family:'Fredoka',sans-serif; font-weight:600;
    font-size:.68rem; text-transform:uppercase; letter-spacing:.5px;
    padding:4px 10px; border-radius:999px; color:#fff;
  }

  .question-panel{display:flex; flex-direction:column; gap:14px;}
  .question-eyebrow{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:.75rem; text-transform:uppercase;
    letter-spacing:.6px; color:var(--muted);
  }
  .question-text{font-size:1.08rem; font-weight:600; line-height:1.45; margin:0;}
  .hint-text{font-size:.82rem; color:var(--muted); margin:0;}

  .answer-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .answer-input{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.2rem;
    border:2px solid var(--line); border-radius:12px; padding:10px 14px; width:120px;
    background:#fff; color:var(--ink);
  }
  .answer-input:focus{outline:none; border-color:var(--violet);}
  .unit-label{font-weight:700; color:var(--muted); font-family:'JetBrains Mono',monospace;}

  .choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:420px){ .choice-grid{grid-template-columns:1fr;} }
  .choice-btn{
    border:2px solid var(--line); background:#fff; border-radius:12px; padding:11px 12px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:.92rem; text-align:left; cursor:pointer;
    transition:all .12s ease;
  }
  .choice-btn:hover{border-color:var(--violet); background:var(--violet-soft);}
  .choice-btn.correct{background:var(--success-soft); border-color:var(--success); color:var(--success);}
  .choice-btn.wrong{background:var(--error-soft); border-color:var(--error); color:var(--error);}
  .choice-btn:disabled{cursor:default;}

  .btn{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:.95rem; border:none; border-radius:12px;
    padding:11px 20px; cursor:pointer; color:#fff; background:var(--ink);
    box-shadow:0 3px 0 rgba(0,0,0,.25); transition:transform .1s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.25);}
  .btn.primary{background:var(--violet);}
  .btn.next{background:var(--viereck); display:none;}
  .btn:disabled{opacity:.45; cursor:default; transform:none;}

  .feedback{
    border-radius:14px; padding:12px 14px; font-size:.9rem; font-weight:600; display:none;
    align-items:flex-start; gap:8px; line-height:1.4;
  }
  .feedback.show{display:flex;}
  .feedback.ok{background:var(--success-soft); color:var(--success);}
  .feedback.bad{background:var(--error-soft); color:var(--error);}
  .feedback .explain{display:block; font-weight:500; color:var(--ink); margin-top:4px;}

  /* ---------- Footer progress ---------- */
  .session-row{
    display:flex; justify-content:space-between; align-items:center; margin-top:16px;
    font-size:.78rem; color:var(--muted); font-weight:600; flex-wrap:wrap; gap:6px;
  }
  .badges{display:flex; gap:6px; flex-wrap:wrap;}
  .badge{
    font-family:'Fredoka',sans-serif; font-size:.7rem; font-weight:600; padding:4px 9px;
    border-radius:999px; background:var(--gold-soft); color:#8a5c0e; border:1px solid var(--gold);
  }

  .shape-outline{ fill-opacity:.9; }
  .measure-line{stroke:var(--muted); stroke-width:1.2; stroke-dasharray:3 3;}
  .dim-label{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; fill:var(--ink);}
  .angle-label{font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;}
  .tick{stroke:var(--ink); stroke-width:2;}
  .right-angle{fill:none; stroke:var(--ink); stroke-width:1.6;}
</style>
</head>
<body>
<div class="wrap">

  <div class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48">
        <polygon points="24,6 42,38 6,38" fill="none" stroke="#FF6B4A" stroke-width="3" stroke-linejoin="round"/>
        <rect x="6" y="4" width="16" height="16" fill="none" stroke="#1FA294" stroke-width="3" transform="rotate(18 14 12)"/>
      </svg>
      <div>
        <h1>Die Formen-Werkstatt</h1>
        <p>Dreiecke &amp; Vierecke üben – so oft du willst</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat-pill points"><span class="lbl">Punkte</span><span id="pointsVal">0</span></div>
      <div class="stat-pill streak"><span class="lbl">🔥 Serie</span><span id="streakVal">0</span></div>
      <div class="stat-pill level"><span class="lbl">Rang</span><span id="levelVal">Lehrling</span></div>
    </div>
  </div>

  <div class="level-bar-row">
    <span class="level-name" id="levelNameSmall">Geometrie-Lehrling</span>
    <div class="level-track"><div class="level-fill" id="levelFill"></div></div>
    <span class="level-next" id="levelNext">100 Punkte bis zum nächsten Rang</span>
  </div>

  <div class="chips" id="chips"></div>

  <div class="board">
    <div class="figure-panel">
      <span class="topic-badge" id="topicBadge">Dreieck</span>
      <div id="figureHost"></div>
    </div>
    <div class="question-panel">
      <span class="question-eyebrow" id="eyebrow">Aufgabe</span>
      <p class="question-text" id="questionText">Lade Aufgabe …</p>
      <p class="hint-text" id="hintText"></p>

      <div id="answerArea"></div>

      <div class="feedback" id="feedback"></div>

      <div class="answer-row">
        <button class="btn primary" id="checkBtn">Prüfen</button>
        <button class="btn next" id="nextBtn">Nächste Aufgabe →</button>
      </div>
    </div>
  </div>

  <div class="session-row">
    <span id="sessionStat">0 Aufgaben gelöst · 0 richtig</span>
    <div class="badges" id="badges"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ============ Utilities ============ */
  function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function randf(min,max){ return Math.random()*(max-min)+min; }
  function choice(arr){ return arr[rand(0,arr.length-1)]; }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=rand(0,i); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function dist(p,q){ return Math.hypot(p.x-q.x, p.y-q.y); }
  function mid(p,q){ return {x:(p.x+q.x)/2, y:(p.y+q.y)/2}; }
  function centroidOf(pts){
    var sx=0, sy=0;
    pts.forEach(function(p){ sx+=p.x; sy+=p.y; });
    return {x:sx/pts.length, y:sy/pts.length};
  }
  function fmt(n){
    return (Math.round(n*100)/100).toString().replace(".", ",");
  }

  /* Perpendicular outward offset point for edge label */
  function edgeLabelPos(p1, p2, centroid, offset){
    offset = offset || 16;
    var mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    var dx=p2.x-p1.x, dy=p2.y-p1.y;
    var len = Math.hypot(dx,dy) || 1;
    var nx = -dy/len, ny = dx/len;
    var toCentroid = {x:centroid.x-mx, y:centroid.y-my};
    var dot = nx*toCentroid.x + ny*toCentroid.y;
    if(dot > 0){ nx=-nx; ny=-ny; } // point away from centroid
    return {x:mx+nx*offset, y:my+ny*offset};
  }

  function vertexLabelPos(v, centroid, dist_){
    dist_ = dist_ || 26;
    var dx = centroid.x-v.x, dy = centroid.y-v.y;
    var len = Math.hypot(dx,dy) || 1;
    return {x: v.x + (dx/len)*dist_, y: v.y + (dy/len)*dist_};
  }

  function tickMarks(p1,p2,count,color){
    var out = "";
    var dx=p2.x-p1.x, dy=p2.y-p1.y;
    var len = Math.hypot(dx,dy) || 1;
    var ux=dx/len, uy=dy/len;
    var nx=-uy, ny=ux;
    var mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    var spacing = 5;
    var start = -((count-1)/2)*spacing;
    for(var i=0;i<count;i++){
      var off = start + i*spacing;
      var cx = mx + ux*off, cy = my + uy*off;
      out += '<line class="tick" x1="'+(cx-nx*5)+'" y1="'+(cy-ny*5)+'" x2="'+(cx+nx*5)+'" y2="'+(cy+ny*5)+'" stroke="'+(color||"var(--ink)")+'"/>';
    }
    return out;
  }

  function rightAngleMarker(vertex, a, b, size){
    size = size || 13;
    function unit(p,q){ var dx=q.x-p.x, dy=q.y-p.y; var l=Math.hypot(dx,dy)||1; return {x:dx/l,y:dy/l}; }
    var u1 = unit(vertex,a), u2 = unit(vertex,b);
    var p1 = {x:vertex.x+u1.x*size, y:vertex.y+u1.y*size};
    var p2 = {x:vertex.x+u1.x*size+u2.x*size, y:vertex.y+u1.y*size+u2.y*size};
    var p3 = {x:vertex.x+u2.x*size, y:vertex.y+u2.y*size};
    return '<path class="right-angle" d="M '+p1.x+' '+p1.y+' L '+p2.x+' '+p2.y+' L '+p3.x+' '+p3.y+'"/>';
  }

  function normalizeAndScale(pts, viewW, viewH, pad){
    viewW = viewW || 300; viewH = viewH || 220; pad = pad===undefined?34:pad;
    var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    pts.forEach(function(p){
      if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
      if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    });
    var w = maxX-minX || 1, h = maxY-minY || 1;
    var scale = Math.min((viewW-2*pad)/w, (viewH-2*pad)/h);
    var offX = (viewW - w*scale)/2 - minX*scale;
    var offY = (viewH - h*scale)/2 - minY*scale;
    return pts.map(function(p){ return {x:p.x*scale+offX, y:p.y*scale+offY}; });
  }

  var COLORS = {
    dreieck: {main:"var(--triangle)", soft:"var(--triangle-soft)"},
    viereck: {main:"var(--viereck)", soft:"var(--viereck-soft)"}
  };

  /* Build full SVG markup for a polygon with optional side/angle labels & marks */
  function polygonSVG(pts, opts){
    opts = opts || {};
    var color = opts.color || "var(--ink)";
    var soft = opts.soft || "var(--paper)";
    var centroid = centroidOf(pts);
    var pointStr = pts.map(function(p){ return p.x+","+p.y; }).join(" ");
    var pathD = "M " + pts.map(function(p){return p.x+" "+p.y;}).join(" L ") + " Z";

    var extras = "";

    // side labels
    if(opts.sideLabels){
      for(var i=0;i<pts.length;i++){
        var a = pts[i], b = pts[(i+1)%pts.length];
        var lbl = opts.sideLabels[i];
        if(lbl===undefined || lbl===null) continue;
        var pos = edgeLabelPos(a,b,centroid, opts.labelOffset||17);
        extras += '<text class="dim-label" x="'+pos.x+'" y="'+pos.y+'" text-anchor="middle" dominant-baseline="middle">'+lbl+'</text>';
      }
    }

    // tick marks: opts.ticks = array (same length as pts) of counts, 0 = none
    if(opts.ticks){
      for(var t=0;t<pts.length;t++){
        var cnt = opts.ticks[t];
        if(cnt>0){
          var a2 = pts[t], b2 = pts[(t+1)%pts.length];
          extras += tickMarks(a2,b2,cnt,color);
        }
      }
    }

    // right angle marker at vertex index
    if(opts.rightAngleAt !== undefined && opts.rightAngleAt !== null){
      var idx = opts.rightAngleAt;
      var prev = pts[(idx-1+pts.length)%pts.length];
      var nxt = pts[(idx+1)%pts.length];
      extras += rightAngleMarker(pts[idx], prev, nxt, 14);
    }

    // vertex angle value labels: opts.angleLabels = array parallel to pts, string or null
    if(opts.angleLabels){
      for(var v=0; v<pts.length; v++){
        var al = opts.angleLabels[v];
        if(al===undefined || al===null) continue;
        var vp = vertexLabelPos(pts[v], centroid, opts.angleDist || 30);
        extras += '<text class="angle-label" x="'+vp.x+'" y="'+vp.y+'" text-anchor="middle" dominant-baseline="middle" fill="'+color+'">'+al+'</text>';
      }
    }

    var svg = '<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">' +
      '<path class="shape-outline" d="'+pathD+'" fill="'+soft+'" stroke="'+color+'" stroke-width="3.5" stroke-linejoin="round"/>' +
      extras +
      '</svg>';
    return svg;
  }

  function renderFigure(svgMarkup, badgeText, badgeColor){
    var host = document.getElementById("figureHost");
    host.innerHTML = svgMarkup;
    var badge = document.getElementById("topicBadge");
    badge.textContent = badgeText;
    badge.style.background = badgeColor;
    var path = host.querySelector("path.shape-outline");
    if(path && path.getTotalLength){
      var len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      path.getBoundingClientRect(); // force reflow
      path.style.transition = "stroke-dashoffset 0.9s cubic-bezier(.3,.7,.3,1)";
      requestAnimationFrame(function(){ path.style.strokeDashoffset = "0"; });
    }
  }

  /* ============ Shape templates ============ */

  function triangleFromSides(a,b,c){
    // c = AB (base), a = BC, b = CA
    var A = {x:0,y:0}, B = {x:c,y:0};
    var Cx = (b*b - a*a + c*c) / (2*c);
    var Cy2 = b*b - Cx*Cx;
    var Cy = Math.sqrt(Cy2 > 0.01 ? Cy2 : 0.01);
    var C = {x:Cx, y:-Cy};
    return [A,B,C];
  }

  function isValidTriangle(a,b,c){
    return (a+b>c) && (b+c>a) && (a+c>b);
  }

  function parallelogramFromSides(a,b,angleDeg){
    var rad = angleDeg*Math.PI/180;
    var A = {x:0,y:0};
    var B = {x:a,y:0};
    var D = {x:b*Math.cos(rad), y:-b*Math.sin(rad)};
    var C = {x:B.x+D.x, y:B.y+D.y};
    return [A,B,C,D];
  }

  /* Fixed illustrative templates (viewBox 300x220), used for recognition/property/angle demos */
  var TRI_TEMPLATES = {
    gleichseitig: [{x:150,y:24},{x:52,y:192},{x:248,y:192}],
    gleichschenklig: [{x:150,y:26},{x:76,y:196},{x:224,y:196}],
    ungleichseitig: [{x:64,y:34},{x:40,y:196},{x:258,y:150}],
    rechtwinklig: [{x:64,y:34},{x:64,y:196},{x:252,y:196}],
    stumpfwinklig: [{x:30,y:150},{x:100,y:190},{x:270,y:60}],
    spitzwinklig: [{x:150,y:56},{x:56,y:190},{x:244,y:190}]
  };
  var QUAD_TEMPLATES = {
    quadrat: [{x:92,y:42},{x:208,y:42},{x:208,y:158},{x:92,y:158}],
    rechteck: [{x:48,y:60},{x:252,y:60},{x:252,y:160},{x:48,y:160}],
    parallelogramm: [{x:78,y:52},{x:238,y:52},{x:198,y:170},{x:38,y:170}],
    raute: [{x:150,y:22},{x:230,y:112},{x:150,y:202},{x:70,y:112}],
    trapez: [{x:60,y:52},{x:220,y:52},{x:262,y:170},{x:18,y:170}],
    drachen: [{x:150,y:22},{x:222,y:104},{x:150,y:150},{x:78,y:104}]
  };

  var TRI_NAMES_SEITEN = {
    gleichseitig:"gleichseitig", gleichschenklig:"gleichschenklig",
    ungleichseitig:"ungleichseitig (unregelmäßig)", rechtwinklig:"ungleichseitig (unregelmäßig)",
    stumpfwinklig:"ungleichseitig (unregelmäßig)", spitzwinklig:"gleichschenklig"
  };
  var TRI_NAMES_WINKEL = {
    gleichseitig:"spitzwinklig", gleichschenklig:"spitzwinklig", ungleichseitig:"spitzwinklig",
    rechtwinklig:"rechtwinklig", stumpfwinklig:"stumpfwinklig", spitzwinklig:"spitzwinklig"
  };
  var QUAD_NAMES = {
    quadrat:"Quadrat", rechteck:"Rechteck", parallelogramm:"Parallelogramm",
    raute:"Raute", trapez:"Trapez", drachen:"Drachenviereck"
  };

  /* ============ Exercise generators ============ */

  function baseEx(category, topic){
    return {category:category, topic:topic};
  }

  // 1) Winkelsumme im Dreieck
  function genDreieckWinkel(){
    var a,b,c;
    do{
      a = rand(25,120); b = rand(25,120); c = 180-a-b;
    } while(c<20 || c>130);
    var pts = normalizeAndScale(choice([TRI_TEMPLATES.ungleichseitig, TRI_TEMPLATES.stumpfwinklig, TRI_TEMPLATES.spitzwinklig]),300,220,34);
    var missingIdx = rand(0,2);
    var vals = [a,b,c];
    var labels = vals.map(function(v,i){ return i===missingIdx ? "?" : v+"°"; });
    var svg = polygonSVG(pts, {
      color:COLORS.dreieck.main, soft:COLORS.dreieck.soft,
      angleLabels: labels, angleDist: 30
    });
    var ex = baseEx("dreieck","winkel");
    ex.question = "In diesem Dreieck kennst du zwei Winkel. Wie groß ist der fehlende Winkel?";
    ex.hint = "Merke dir: Die Winkelsumme im Dreieck beträgt immer 180°. (Skizze nicht maßstabsgetreu)";
    ex.svg = svg; ex.badge="Dreieck · Winkel"; ex.badgeColor=COLORS.dreieck.main;
    ex.inputType="number"; ex.unit="°"; ex.answer = vals[missingIdx];
    ex.explanation = "Rechnung: 180° − "+vals[(missingIdx+1)%3]+"° − "+vals[(missingIdx+2)%3]+"° = "+vals[missingIdx]+"°.";
    return ex;
  }

  // 2) Winkelsumme im Viereck
  function genViereckWinkel(){
    var a,b,c,d;
    do{
      a=rand(50,140); b=rand(50,140); c=rand(50,140); d=360-a-b-c;
    } while(d<40 || d>150);
    var pts = normalizeAndScale(choice([QUAD_TEMPLATES.parallelogramm, QUAD_TEMPLATES.trapez, QUAD_TEMPLATES.drachen]),300,220,34);
    var missingIdx = rand(0,3);
    var vals=[a,b,c,d];
    var labels = vals.map(function(v,i){ return i===missingIdx?"?":v+"°"; });
    var svg = polygonSVG(pts, {color:COLORS.viereck.main, soft:COLORS.viereck.soft, angleLabels:labels, angleDist:28});
    var ex = baseEx("viereck","winkel");
    ex.question = "In diesem Viereck kennst du drei Winkel. Wie groß ist der vierte Winkel?";
    ex.hint = "Merke dir: Die Winkelsumme im Viereck beträgt immer 360°. (Skizze nicht maßstabsgetreu)";
    ex.svg=svg; ex.badge="Viereck · Winkel"; ex.badgeColor=COLORS.viereck.main;
    ex.inputType="number"; ex.unit="°"; ex.answer=vals[missingIdx];

    return ex;
  }

  // 3) Umfang Dreieck (scalene, exact construction)
  function genDreieckUmfang(){
    var a,b,c;
    do{
      a=rand(4,12); b=rand(4,12); c=rand(4,12);
    } while(!isValidTriangle(a,b,c) || (a===b && b===c));
    var raw = triangleFromSides(a,b,c);
    var pts = normalizeAndScale(raw,300,220,36);
    var svg = polygonSVG(pts, {
      color:COLORS.dreieck.main, soft:COLORS.dreieck.soft,
      sideLabels:[a+" cm", b+" cm", c+" cm"], labelOffset:16
    });
    var ex = baseEx("dreieck","umfang");
    ex.question = "Berechne den Umfang dieses Dreiecks.";
    ex.hint = "Der Umfang ist die Summe aller Seitenlängen.";
    ex.svg=svg; ex.badge="Dreieck · Umfang"; ex.badgeColor=COLORS.dreieck.main;
    ex.inputType="number"; ex.unit="cm"; ex.answer=a+b+c;
    ex.explanation = "U = a + b + c = "+a+" cm + "+b+" cm + "+c+" cm = "+(a+b+c)+" cm.";
    return ex;
  }

  // 4) Umfang Viereck (Quadrat/Rechteck)
  function genViereckUmfang(){
    var isSquare = Math.random()<0.4;
    var a = rand(3,12), b = isSquare? a : rand(3,12);
    while(!isSquare && b===a){ b = rand(3,12); }
    var maxDim = Math.max(a,b);
    var scale = 170/maxDim;
    var w=a*scale, h=b*scale;
    var x0=(300-w)/2, y0=(220-h)/2;
    var pts=[{x:x0,y:y0},{x:x0+w,y:y0},{x:x0+w,y:y0+h},{x:x0,y:y0+h}];
    var svg = polygonSVG(pts, {
      color:COLORS.viereck.main, soft:COLORS.viereck.soft,
      sideLabels:[a+" cm", b+" cm", a+" cm", b+" cm"], labelOffset:16,
      ticks: isSquare? [1,1,1,1] : [1,2,1,2]
    });
    var ex = baseEx("viereck","umfang");
    ex.question = isSquare
      ? "Berechne den Umfang dieses Quadrats."
      : "Berechne den Umfang dieses Rechtecks.";
    ex.hint = isSquare ? "Beim Quadrat sind alle 4 Seiten gleich lang: U = 4 · a." : "Beim Rechteck gilt: U = 2 · (a + b).";
    ex.svg=svg; ex.badge = isSquare? "Quadrat · Umfang":"Rechteck · Umfang"; ex.badgeColor=COLORS.viereck.main;
    ex.inputType="number"; ex.unit="cm";
    ex.answer = isSquare ? 4*a : 2*(a+b);
    ex.explanation = isSquare
      ? "U = 4 · a = 4 · "+a+" cm = "+(4*a)+" cm."
      : "U = 2 · (a + b) = 2 · ("+a+" cm + "+b+" cm) = "+(2*(a+b))+" cm.";
    return ex;
  }

  // 5) Fläche Dreieck (Grundlinie × Höhe / 2)
  function genDreieckFlaeche(){
    var g = rand(4,14), h = rand(3,12);
    var scale = 170/Math.max(g,h,10);
    var gW = g*scale, hH = h*scale;
    var baseY = 190;
    var Bx = (300-gW)/2, By = baseY;
    var Cx = Bx+gW, Cy = baseY;
    var apexOffset = rand(-Math.floor(gW*0.3), Math.floor(gW*0.3));
    var Ax = Bx + gW/2 + apexOffset, Ay = baseY - hH;
    var footX = Bx + gW/2 + apexOffset;
    var pts = [{x:Ax,y:Ay},{x:Bx,y:By},{x:Cx,y:Cy}];
    var centroid = centroidOf(pts);
    var svg = '<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">';
    var pathD = "M "+Ax+" "+Ay+" L "+Bx+" "+By+" L "+Cx+" "+Cy+" Z";
    svg += '<path class="shape-outline" d="'+pathD+'" fill="'+COLORS.dreieck.soft+'" stroke="'+COLORS.dreieck.main+'" stroke-width="3.5" stroke-linejoin="round"/>';
    svg += '<line class="measure-line" x1="'+footX+'" y1="'+Ay+'" x2="'+footX+'" y2="'+By+'"/>';
    if(footX>=Bx-1 && footX<=Cx+1){
      svg += rightAngleMarker({x:footX,y:By}, {x:footX,y:Ay}, {x:footX> (Bx+Cx)/2 ? Bx: Cx, y:By}, 12);
    }
    var baseLabel = edgeLabelPos({x:Bx,y:By},{x:Cx,y:Cy}, centroid, 18);
    svg += '<text class="dim-label" x="'+baseLabel.x+'" y="'+baseLabel.y+'" text-anchor="middle">g = '+g+' cm</text>';
    svg += '<text class="dim-label" x="'+(footX+10)+'" y="'+((Ay+By)/2)+'" text-anchor="start" dominant-baseline="middle">h = '+h+' cm</text>';
    svg += '</svg>';

    var ex = baseEx("dreieck","flaeche");
    ex.question = "Berechne die Fläche dieses Dreiecks.";
    ex.hint = "Formel: A = (Grundlinie · Höhe) : 2.";
    ex.svg=svg; ex.badge="Dreieck · Fläche"; ex.badgeColor=COLORS.dreieck.main;
    ex.inputType="number"; ex.unit="cm²";
    ex.answer = (g*h)/2;
    ex.explanation = "A = (g · h) : 2 = ("+g+" cm · "+h+" cm) : 2 = "+fmt((g*h)/2)+" cm².";
    ex._svgIsPath = true;
    return ex;
  }

  // 6) Fläche Rechteck / Quadrat
  function genRechteckFlaeche(){
    var isSquare = Math.random()<0.4;
    var a = rand(3,12), b = isSquare? a : rand(3,12);
    while(!isSquare && b===a){ b=rand(3,12); }
    var maxDim=Math.max(a,b);
    var scale=170/maxDim;
    var w=a*scale, h=b*scale;
    var x0=(300-w)/2, y0=(220-h)/2;
    var pts=[{x:x0,y:y0},{x:x0+w,y:y0},{x:x0+w,y:y0+h},{x:x0,y:y0+h}];
    var svg = polygonSVG(pts,{
      color:COLORS.viereck.main, soft:COLORS.viereck.soft,
      sideLabels:[a+" cm", b+" cm", a+" cm", b+" cm"], labelOffset:16,
      ticks: isSquare?[1,1,1,1]:[1,2,1,2]
    });
    var ex = baseEx("viereck","flaeche");
    ex.question = isSquare ? "Berechne die Fläche dieses Quadrats." : "Berechne die Fläche dieses Rechtecks.";
    ex.hint = isSquare ? "Formel: A = a · a." : "Formel: A = a · b.";
    ex.svg=svg; ex.badge=isSquare?"Quadrat · Fläche":"Rechteck · Fläche"; ex.badgeColor=COLORS.viereck.main;
    ex.inputType="number"; ex.unit="cm²";
    ex.answer = a*b;
    ex.explanation = isSquare
      ? "A = a · a = "+a+" cm · "+a+" cm = "+(a*a)+" cm²."
      : "A = a · b = "+a+" cm · "+b+" cm = "+(a*b)+" cm².";
    return ex;
  }

  // 7) Fläche Parallelogramm
  function genParallelogrammFlaeche(){
    var g = rand(5,14), h = rand(3,10);
    var scale = 170/Math.max(g,h,10);
    var gW=g*scale, hH=h*scale;
    var slant = rand(20,60);
    var Bx=(300-gW-slant)/2, By=170;
    var Cx=Bx+gW, Cy=170;
    var Dx=Cx-slant, Dy=170-hH;
    var Ax=Bx-slant, Ay=170-hH;
    var pts=[{x:Ax,y:Ay},{x:Bx,y:By},{x:Cx,y:Cy},{x:Dx,y:Dy}];
    var centroid = centroidOf(pts);
    var svg='<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">';
    var pathD="M "+pts.map(function(p){return p.x+" "+p.y;}).join(" L ")+" Z";
    svg+='<path class="shape-outline" d="'+pathD+'" fill="'+COLORS.viereck.soft+'" stroke="'+COLORS.viereck.main+'" stroke-width="3.5" stroke-linejoin="round"/>';
    var footX = Bx + slant*0; // foot directly below D
    var Fx = Dx, Fy = By;
    svg += '<line class="measure-line" x1="'+Dx+'" y1="'+Dy+'" x2="'+Fx+'" y2="'+Fy+'"/>';
    svg += rightAngleMarker({x:Fx,y:Fy},{x:Fx,y:Dy},{x:Cx,y:Cy},12);
    var baseLbl = edgeLabelPos(pts[1],pts[2],centroid,18);
    svg += '<text class="dim-label" x="'+baseLbl.x+'" y="'+baseLbl.y+'" text-anchor="middle">g = '+g+' cm</text>';
    svg += '<text class="dim-label" x="'+(Fx-14)+'" y="'+((Dy+By)/2)+'" text-anchor="end" dominant-baseline="middle">h = '+h+' cm</text>';
    svg += tickMarks(pts[0],pts[1],1,COLORS.viereck.main);
    svg += tickMarks(pts[2],pts[3],1,COLORS.viereck.main);
    svg += '</svg>';

    var ex = baseEx("viereck","flaeche");
    ex.question = "Berechne die Fläche dieses Parallelogramms.";
    ex.hint = "Formel: A = Grundlinie · Höhe.";
    ex.svg=svg; ex.badge="Parallelogramm · Fläche"; ex.badgeColor=COLORS.viereck.main;
    ex.inputType="number"; ex.unit="cm²";
    ex.answer = g*h;
    ex.explanation = "A = g · h = "+g+" cm · "+h+" cm = "+(g*h)+" cm².";
    return ex;
  }

  // 8) Fläche Trapez
  function genTrapezFlaeche(){
    var a = rand(8,16); // lange parallele Seite
    var c = rand(3,a-2); // kurze parallele Seite
    var h = rand(3,10);
    var pts = normalizeAndScale(QUAD_TEMPLATES.trapez, 300, 220, 34);
    var centroid = centroidOf(pts);
    var svg = '<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">';
    var pathD = "M "+pts.map(function(p){return p.x+" "+p.y;}).join(" L ")+" Z";
    svg += '<path class="shape-outline" d="'+pathD+'" fill="'+COLORS.viereck.soft+'" stroke="'+COLORS.viereck.main+'" stroke-width="3.5" stroke-linejoin="round"/>';
    var topLbl = edgeLabelPos(pts[0],pts[1],centroid,16);
    var botLbl = edgeLabelPos(pts[2],pts[3],centroid,16);
    svg += '<text class="dim-label" x="'+topLbl.x+'" y="'+topLbl.y+'" text-anchor="middle">c = '+c+' cm</text>';
    svg += '<text class="dim-label" x="'+botLbl.x+'" y="'+botLbl.y+'" text-anchor="middle">a = '+a+' cm</text>';
    var midLeft = mid(pts[0],pts[3]);
    svg += '<text class="dim-label" x="'+(midLeft.x-6)+'" y="'+(midLeft.y)+'" text-anchor="end">h = '+h+' cm</text>';
    svg += '<line class="measure-line" x1="'+pts[0].x+'" y1="'+pts[0].y+'" x2="'+pts[0].x+'" y2="'+pts[3].y+'"/>';
    svg += '</svg>';

    var ex = baseEx("viereck","flaeche");
    ex.question = "Berechne die Fläche dieses Trapezes (Skizze schematisch).";
    ex.hint = "Formel: A = ((a + c) : 2) · h, wobei a und c die parallelen Seiten sind.";
    ex.svg=svg; ex.badge="Trapez · Fläche"; ex.badgeColor=COLORS.viereck.main;
    ex.inputType="number"; ex.unit="cm²";
    ex.answer = ((a+c)/2)*h;
    ex.explanation = "A = ((a + c) : 2) · h = (("+a+" + "+c+") : 2) · "+h+" = "+fmt(((a+c)/2)*h)+" cm².";
    return ex;
  }

  // 9) Dreieck erkennen (nach Seiten ODER nach Winkeln)
  function genDreieckErkennen(){
    var bySeiten = Math.random()<0.5;
    var key = choice(Object.keys(TRI_TEMPLATES));
    var pts = normalizeAndScale(TRI_TEMPLATES[key], 300, 220, 32);
    var ticks = null, rightAt = null;
    if(key==="gleichseitig") ticks=[1,1,1];
    if(key==="gleichschenklig" || key==="spitzwinklig") ticks=[1,0,1];
    if(key==="rechtwinklig") rightAt = 1;
    var svg = polygonSVG(pts, {color:COLORS.dreieck.main, soft:COLORS.dreieck.soft, ticks:ticks, rightAngleAt:rightAt});
    var ex = baseEx("dreieck","erkennen");
    var correct = bySeiten ? TRI_NAMES_SEITEN[key] : TRI_NAMES_WINKEL[key];
    var allSeiten = ["gleichseitig","gleichschenklig","ungleichseitig (unregelmäßig)"];
    var allWinkel = ["spitzwinklig","rechtwinklig","stumpfwinklig"];
    var pool = bySeiten ? allSeiten : allWinkel;
    var wrongOptions = pool.filter(function(o){ return o!==correct; });
    var options = shuffle([correct].concat(wrongOptions));
    ex.question = bySeiten
      ? "Wie wird dieses Dreieck nach seinen Seitenlängen genannt?"
      : "Wie wird dieses Dreieck nach seinen Winkeln genannt?";
    ex.hint = bySeiten
      ? "Achte auf die Markierungen: gleich viele Striche = gleich lange Seiten."
      : "Achte auf das kleine Quadrat – es zeigt einen rechten Winkel (90°).";
    ex.svg=svg; ex.badge="Dreieck · Erkennen"; ex.badgeColor=COLORS.dreieck.main;
    ex.inputType="mc"; ex.choices=options; ex.correctIndex=options.indexOf(correct);
    ex.explanation = "Richtig ist: "+correct+".";
    return ex;
  }

  // 10) Viereck erkennen

    ex.explanation = "Richtig ist: "+correct+".";
    return ex;
  }

  MODES.forEach(function(m){
    var btn = document.createElement("button");
    btn.className = "chip" + (m.id===state.mode?" active":"");
    btn.textContent = m.label;
    btn.dataset.mode = m.id;
    btn.addEventListener("click", function(){
      state.mode = m.id;
      Array.prototype.forEach.call(chipsHost.children, function(c){ c.classList.remove("active"); });
      btn.classList.add("active");
      nextExercise();
    });
    chipsHost.appendChild(btn);
  });

  function updateStatsUI(){
    document.getElementById("pointsVal").textContent = state.points;
    document.getElementById("streakVal").textContent = state.streak;
    var lvl = currentLevel();
    document.getElementById("levelVal").textContent = lvl.name.split(" ")[0];
    document.getElementById("levelNameSmall").textContent = lvl.name;
    var nxt = nextLevel();
    var fill = document.getElementById("levelFill");
    var nextEl = document.getElementById("levelNext");
    if(nxt){
      var span = nxt.min - lvl.min;
      var progressed = state.points - lvl.min;
      var pct = Math.max(0, Math.min(100, (progressed/span)*100));
      fill.style.width = pct+"%";
      nextEl.textContent = (nxt.min-state.points)+" Punkte bis „"+nxt.name+"“";
    } else {
      fill.style.width = "100%";
      nextEl.textContent = "Höchster Rang erreicht! 👑";
    }
    document.getElementById("sessionStat").textContent = state.solved+" Aufgaben gelöst · "+state.correct+" richtig";
    renderBadges();
  }

  function maybeAwardBadge(id, label){
    if(state.badges.indexOf(id)===-1){
      state.badges.push(id);
      renderBadges();
    }
  }
  function renderBadges(){
    var host = document.getElementById("badges");
    var defs = {
      streak5: "🔥 Serie x5", streak10:"🔥🔥 Serie x10",
      solved10:"📚 10 gelöst", solved25:"📚 25 gelöst", solved50:"📚 50 gelöst"
    };
    host.innerHTML = state.badges.map(function(b){ return '<span class="badge">'+defs[b]+'</span>'; }).join("");
  }

  function checkBadges(){
    if(state.streak>=5) maybeAwardBadge("streak5");
    if(state.streak>=10) maybeAwardBadge("streak10");
    if(state.solved>=10) maybeAwardBadge("solved10");
    if(state.solved>=25) maybeAwardBadge("solved25");
    if(state.solved>=50) maybeAwardBadge("solved50");
  }

  var eyebrowMap = {
    winkel:"Winkel berechnen", umfang:"Umfang berechnen", flaeche:"Fläche berechnen",
    erkennen:"Form erkennen", eigenschaften:"Wahr oder falsch"
  };

  function nextExercise(){
    var mode = MODES.filter(function(m){return m.id===state.mode;})[0];
    var key = choice(mode.pool);
    var ex = GEN[key]();
    state.current = ex;
    state.answered = false;

    document.getElementById("eyebrow").textContent = eyebrowMap[ex.topic] || "Aufgabe";
    document.getElementById("questionText").textContent = ex.question;
    document.getElementById("hintText").textContent = ex.hint || "";
    renderFigure(ex.svg, ex.badge, ex.badgeColor);

    var answerArea = document.getElementById("answerArea");
    answerArea.innerHTML = "";
    if(ex.inputType==="number"){
      var row = document.createElement("div");
      row.className="answer-row";
      var input = document.createElement("input");
      input.type="text"; input.inputMode="decimal"; input.className="answer-input"; input.id="numInput";
      input.placeholder="Antwort";
      input.addEventListener("keydown", function(e){ if(e.key==="Enter"){ handleCheck(); } });
      var unit = document.createElement("span");
      unit.className="unit-label"; unit.textContent = ex.unit;
      row.appendChild(input); row.appendChild(unit);
      answerArea.appendChild(row);
      setTimeout(function(){ input.focus(); }, 50);
    } else {
      var grid = document.createElement("div");
      grid.className="choice-grid";
      ex.choices.forEach(function(c, i){
        var b = document.createElement("button");
        b.className="choice-btn"; b.textContent=c; b.dataset.index=i;
        b.addEventListener("click", function(){ handleChoice(i); });
        grid.appendChild(b);
      });
      answerArea.appendChild(grid);
    }

    var fb = document.getElementById("feedback");
    fb.className="feedback"; fb.innerHTML="";
    document.getElementById("checkBtn").style.display = ex.inputType==="number" ? "inline-block":"none";
    document.getElementById("checkBtn").disabled=false;
    document.getElementById("nextBtn").style.display="none";
  }

  function finishRound(isCorrect, explanation){
    state.answered = true;
    state.solved += 1;
    if(isCorrect){
      state.correct += 1;
      state.streak += 1;
      state.bestStreak = Math.max(state.bestStreak, state.streak);
      var bonus = Math.min(10, state.streak) ;
      state.points += 10 + bonus;
    } else {
      state.streak = 0;
    }
    checkBadges();
    updateStatsUI();

    var fb = document.getElementById("feedback");
    fb.className = "feedback show " + (isCorrect?"ok":"bad");
    var msg = isCorrect ? choice(ENCOURAGE_OK) : choice(ENCOURAGE_BAD);
    fb.innerHTML = msg + '<span class="explain">'+explanation+'</span>';
    document.getElementById("checkBtn").disabled = true;
    document.getElementById("nextBtn").style.display="inline-block";
  }

  function handleCheck(){
    if(state.answered) return;
    var ex = state.current;
    if(ex.inputType!=="number") return;
    var input = document.getElementById("numInput");
    var raw = input.value.trim().replace(",", ".");
    if(raw===""){ input.focus(); return; }
    var val = parseFloat(raw);
    if(isNaN(val)) { input.focus(); return; }
    var isCorrect = Math.abs(val - ex.answer) < 0.05;
    input.disabled = true;
    finishRound(isCorrect, ex.explanation);
  }

  function handleChoice(i){
    if(state.answered) return;
    var ex = state.current;
    var buttons = document.querySelectorAll(".choice-btn");
    buttons.forEach(function(b){ b.disabled = true; });
    var isCorrect = (i === ex.correctIndex);
    buttons[i].classList.add(isCorrect?"correct":"wrong");
    if(!isCorrect){ buttons[ex.correctIndex].classList.add("correct"); }
    finishRound(isCorrect, ex.explanation);
  }

  document.getElementById("checkBtn").addEventListener("click", handleCheck);
  document.getElementById("nextBtn").addEventListener("click", nextExercise);

  updateStatsUI();
  nextExercise();
})();
</script>
</body>
</html>
